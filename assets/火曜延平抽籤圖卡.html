<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  *{box-sizing:border-box} html,body{margin:0;width:1080px;height:1350px;overflow:hidden}
  body{font-family:"PingFang TC","Noto Sans TC",sans-serif;background:#170507;color:#fff}
  .card{position:relative;width:1080px;height:1350px;padding:62px 66px 52px;border:18px solid #48100a;background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 3px,transparent 3px 8px),
    radial-gradient(circle at 50% 110%,#f45116 0 9%,#a51f0c 19%,transparent 42%),
    radial-gradient(circle at 8% 8%,rgba(255,128,0,.28),transparent 25%),
    linear-gradient(180deg,#310708 0%,#170507 63%,#090203 100%);box-shadow:inset 0 0 0 8px #ff6b16}
  .court{position:absolute;inset:0;opacity:.13;background:
    linear-gradient(90deg,transparent 49.6%,#ffbd45 49.7%,#ffbd45 50.3%,transparent 50.4%),
    linear-gradient(transparent 71%,#ffbd45 71.1%,#ffbd45 71.5%,transparent 71.6%)}
  .flame{position:absolute;font-size:118px;filter:drop-shadow(0 0 18px #ff5600);opacity:.36}
  .f1{right:42px;top:18px}.f2{left:12px;bottom:22px;transform:scale(.78)}
  .eyebrow{position:relative;display:inline-flex;align-items:center;gap:12px;padding:12px 24px;border:4px solid #ff8a19;background:#260508;color:#ffd46d;font-size:28px;font-weight:900;letter-spacing:3px;box-shadow:7px 7px 0 #8e1f0b}
  h1{position:relative;margin:34px 0 10px;color:#fff5da;text-shadow:6px 6px 0 #9d1d0c,0 0 20px #ff6718;font-size:82px;line-height:1.08;letter-spacing:3px}
  .sub{position:relative;color:#ffd04b;text-shadow:3px 3px 0 #6e1308;font-size:43px;font-weight:900;letter-spacing:2px;margin-bottom:42px}
  .info{position:relative;background:#22080a;border:5px solid #ff7020;padding:34px 36px;box-shadow:10px 10px 0 #7e170b,inset 0 0 0 3px #6b130c}
  .row{display:grid;grid-template-columns:70px 1fr;align-items:start;margin:18px 0;font-size:43px;font-weight:900;line-height:1.38}
  .icon{font-size:38px}
  .deadline{position:relative;margin:42px 0 28px;padding:27px 24px;background:#ff3d16;border:5px solid #ffc247;text-align:center;font-size:52px;font-weight:900;line-height:1.28;letter-spacing:2px;box-shadow:9px 9px 0 #751209}
  .reward{position:relative;margin:28px 0 0;padding:20px 24px;background:#ffc247;border:5px solid #fff0a6;color:#451006;text-align:center;font-weight:900;line-height:1.25;box-shadow:9px 9px 0 #8a1c0b}
  .reward-title{font-size:29px;letter-spacing:2px}.reward-main{font-size:38px;margin-top:6px}.reward-alt{font-size:31px;margin-top:5px}
  .more{position:relative;margin-top:34px;text-align:center;color:#ffe5a2;font-size:35px;font-weight:900;line-height:1.5}
  .footer{position:absolute;left:66px;right:66px;bottom:43px;display:flex;justify-content:space-between;align-items:end;color:#f4b78e;font-size:22px;letter-spacing:1px}
  .cta{color:#ffd158;font-size:29px;font-weight:900;text-shadow:2px 2px 0 #8b180a}
</style>
</head>
<body>
  <main class="card">
    <div class="court"></div>
    <div class="flame f1">🔥</div><div class="flame f2">🔥</div>
    <div class="eyebrow">STAGE 10–12｜場地抽籤</div>
    <h1>火曜認真流汗團</h1>
    <div class="sub">一人一票，幫火曜搶場地！</div>

    <section class="info">
      <div class="row"><div class="icon">📍</div><div>台北市｜延平國小<br>羽球場</div></div>
      <div class="row"><div class="icon">🕖</div><div>每週二 19:00–21:00</div></div>
      <div class="row"><div class="icon">🏸</div><div>統一勾選「四面場」</div></div>
    </section>

    <div class="deadline">⏰ 9/4（五）16:00<br>完成登記</div>

    <div class="reward"><div class="reward-title">🏆 中籤者獎勵</div><div class="reward-main">免費季打火曜 1 次</div><div class="reward-alt">或現金 2,000 元</div></div>

    <footer class="footer">
      <div>曜日羽球團｜FIRE STAGE</div>
      <div class="cta">▶ 點下方連結投籤</div>
    </footer>
  </main>
</body>
</html>
