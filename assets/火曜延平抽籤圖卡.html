<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  *{box-sizing:border-box} html,body{margin:0;width:1080px;height:1350px;overflow:hidden}
  body{font-family:"PingFang TC","Noto Sans TC",sans-serif;background:#071f1c;color:#fff}
  .card{position:relative;width:1080px;height:1350px;padding:74px 72px 58px;background:
    radial-gradient(circle at 92% 5%,rgba(255,129,55,.42),transparent 25%),
    linear-gradient(155deg,#123b31 0%,#071f1c 53%,#101d1b 100%)}
  .court{position:absolute;inset:0;opacity:.09;background:
    linear-gradient(90deg,transparent 49.7%,#fff 49.8%,#fff 50.2%,transparent 50.3%),
    linear-gradient(transparent 72%,#fff 72.1%,#fff 72.4%,transparent 72.5%)}
  .eyebrow{position:relative;display:inline-flex;align-items:center;gap:12px;padding:11px 22px;border:2px solid #ff9253;border-radius:999px;color:#ffd6bd;font-size:29px;font-weight:800;letter-spacing:2px}
  h1{position:relative;margin:34px 0 10px;font-size:70px;line-height:1.08;letter-spacing:3px}
  .sub{position:relative;color:#ffd56a;font-size:39px;font-weight:800;letter-spacing:2px;margin-bottom:42px}
  .info{position:relative;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.18);border-radius:28px;padding:33px 38px;box-shadow:0 20px 55px rgba(0,0,0,.22)}
  .row{display:grid;grid-template-columns:62px 1fr;align-items:center;margin:13px 0;font-size:38px;font-weight:700;line-height:1.35}
  .icon{font-size:38px}
  .deadline{position:relative;margin:34px 0 28px;padding:22px 28px;background:#ef4d39;border-radius:20px;text-align:center;font-size:42px;font-weight:900;letter-spacing:2px;box-shadow:0 10px 30px rgba(239,77,57,.26)}
  .tips{position:relative;display:grid;gap:13px;font-size:29px;line-height:1.48;color:#e9f5ef}
  .tip{display:grid;grid-template-columns:42px 1fr}
  .notice{position:relative;margin-top:24px;padding:16px 20px;border-left:7px solid #ffd56a;background:rgba(255,213,106,.09);font-size:29px;font-weight:800;line-height:1.45;color:#fff1bd}
  .footer{position:absolute;left:72px;right:72px;bottom:50px;display:flex;justify-content:space-between;align-items:end;color:#bdd3ca;font-size:24px;letter-spacing:1px}
  .cta{color:#ffb17f;font-size:30px;font-weight:900}
</style>
</head>
<body>
  <main class="card">
    <div class="court"></div>
    <div class="eyebrow">🔥 10–12 月場地抽籤</div>
    <h1>火曜認真流汗團</h1>
    <div class="sub">一人一票，幫火曜搶場地！</div>

    <section class="info">
      <div class="row"><div class="icon">📍</div><div>台北市｜延平國小羽球場</div></div>
      <div class="row"><div class="icon">🕖</div><div>每週二 19:00–21:00</div></div>
      <div class="row"><div class="icon">🏸</div><div>統一勾選「四面場」</div></div>
    </section>

    <div class="deadline">⏰ 今日 16:00 前完成登記</div>

    <section class="tips">
      <div class="tip"><div>1️⃣</div><div>每人限登記一個時段</div></div>
      <div class="tip"><div>2️⃣</div><div>同一時段多人登記時，承租 4 面場者優先</div></div>
      <div class="tip"><div>3️⃣</div><div>中籤後，須由本人前往辦理登記</div></div>
    </section>

    <div class="notice">中籤結果將公布於「延平國小校網」</div>

    <footer class="footer">
      <div>曜日羽球團｜特殊主題羽球趴</div>
      <div class="cta">點下方連結投籤 ❤️</div>
    </footer>
  </main>
</body>
</html>
